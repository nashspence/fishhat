format: deployment-ops/source/v2
kind: App
id: hello
runtime:
  instance: quadlet
  source_schema_digest: sha256:d1dc8d7613a45fa3f516fa4f34c890bea3f9aef45e6d10caaeaa709146a8c3e7
  source:
    files:
    - quadlet/web.container
purpose: Synthetic stateless app
repository_secrets: null
components:
  web:
    role: primary
    profile: ordinary-v1
    purpose: Synthetic web service
    native:
      unit: quadlet/web.container
interfaces:
  http:
    component: web
    protocol: http
    port: 8080
    compatibility:
    - http-v1
    authentication: public
    readiness_hook: health
dependencies: {}
datasets: {}
hooks:
  health:
    component: web
    role: health
    required_checks:
    - HEALTH_OK
    argv:
    - /app/health
    mode: read
    timeout_seconds: 60
    datasets: []
    secrets: []
    network: none
lifecycle:
  health:
  - health
  configure: null
  verify_config: null
  quiesce: null
  transition_assess: null
  transition_apply: null
  transition_verify: null
  checkpoint_policy: stateless
  upgrade_mode: replace
secret_bindings: {}
maintenance: {}
protection: null
resources:
  minimum_memory_bytes: 134217728
  minimum_cpu_millis: 100
  minimum_tasks: 32
  storage_minimum:
    runtime:
      bytes: 268435456
      inodes: 1024
    state:
      bytes: 67108864
      inodes: 1024
    scratch:
      bytes: 268435456
      inodes: 1024
    logs:
      bytes: 67108864
      inodes: 1024
  logs:
    max_file_bytes: 10485760
    closed_retention_seconds: 604800
    overflow: bounded-loss-visible
  retention:
    prior_releases: 1
    minimum_prior_age_seconds: 604800
    unused_candidate_grace_seconds: 86400
    cold_archive: verified-independent-archive
  automatic_gc: true
