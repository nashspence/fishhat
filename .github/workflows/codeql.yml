name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdogs:
    name: Validation watchdog policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Independent bootstrap resource ceiling; policy is not resolved yet.
    env:
      CHECK_PURPOSES: validation-tooling
      CHECK_SCOPE: validation budget planning; no product qualification
      CHECK_AUTHORITY: scripts/validation_workflows.py
      FISHHAT_VALIDATION_SCALE_DEFINED: ${{ contains(toJSON(vars), '"FISHHAT_VALIDATION_TIMEOUT_SCALE":') }}
      FISHHAT_VALIDATION_SCALE_VALUE: ${{ vars.FISHHAT_VALIDATION_TIMEOUT_SCALE }}
    outputs:
      scale: ${{ steps.plan.outputs.scale }}
      budgets: ${{ steps.plan.outputs.budgets }}
      contacts: ${{ steps.plan.outputs.contacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validation_timeouts.py bootstrap --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.24'
      - run: uv sync --locked --all-packages --group dev --python 3.12
      - id: plan
        run: uv run --locked --all-packages --group dev python -m scripts.validation_workflows --workflow .github/workflows/codeql.yml --github-output "$GITHUB_OUTPUT"

  analyze:
    env:
      UV_HTTP_TIMEOUT: ${{ fromJSON(needs.watchdogs.outputs.contacts)['analyze'].uv }}
      FISHHAT_VALIDATION_JOB_MINUTES: ${{ fromJSON(needs.watchdogs.outputs.budgets)['analyze'] }}
      FISHHAT_VALIDATION_NOMINAL_MINUTES: '20'
      FISHHAT_VALIDATION_TIMEOUT_SCALE: ${{ needs.watchdogs.outputs.scale }}
      CHECK_PURPOSES: repository-policy
      CHECK_SCOPE: repository checks; no product or native qualification
      CHECK_AUTHORITY: release.toml
    needs: watchdogs
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.watchdogs.outputs.budgets)['analyze'] }}
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fixed launch targets for C analysis
        if: ${{ matrix.language == 'c-cpp' }}
        run: |
          python3 -I -S - <<'PY'
          import hashlib
          from pathlib import Path
          from runpy import run_path
          installer = run_path("scripts/bundle_install.py")
          header = installer["_owner_launcher_header"]("/codeql/selected-interpreter", "/codeql/selected-program.py")
          with Path("fishhat/host-ops/launcher/targets.h").open("xb") as output:
              output.write(header)
          source = Path("fishhat/host-ops/launcher/launch.c").read_bytes()
          print("codeql-launcher-source-sha256=" + hashlib.sha256(source).hexdigest())
          print("codeql-launcher-header-sha256=" + hashlib.sha256(header).hexdigest())
          PY
      - uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          category: /language:${{ matrix.language }}
