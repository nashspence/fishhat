[tool.uv.workspace]
members = ["packages/*", "fishhat/*", "some-implementations/fishhat/*/*"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "psutil>=7,<8",
  "types-psutil>=7,<8",
  "alembic>=1.20.1,<2",
  "sqlalchemy>=2.1.8,<3",
  "setuptools==84.2.1",
  "pip-audit>=2.10,<3",
  "reuse>=6.3.0,<7",
  "packaging>=26,<27",
  "filelock>=4.2.10,<5",
  "pip>=26.3,<27",
  "mypy>=2.4.1,<3",
  "ruff>=0.17.4,<1",
  "types-pyyaml>=6.0.12.20261103,<7",
  "types-jsonschema>=4.26,<5",
  "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p scripts.validation_pytest"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["(^|/)build/"]
files = ["packages", "fishhat", "some-implementations", "scripts/project_policy.py", "scripts/check_repository.py", "scripts/check_wheel.py", "scripts/bundle_install.py", "scripts/distributions.py", "scripts/smoke_installed.py", "scripts/validation.py", "scripts/validation_pytest.py", "scripts/operation_qualification.py", "scripts/run_stats.py", "scripts/profile.py", "scripts/engineering.py", "scripts/check_evidence.py", "scripts/validation_timeouts.py", "scripts/validation_watchdogs.py", "scripts/validation_workflows.py", "scripts/unit_shards.py", "scripts/native_smoke_cleanup.py", "scripts/native_linux_enrollment.py", "scripts/native_linux_download.py", "scripts/native_linux_images.py", "scripts/native_linux_guest.py", "scripts/native_linux_storage.py", "scripts/native_linux_processes.py", "scripts/native_linux_transport.py", "scripts/native_linux_exhaustion.py", "scripts/native_linux_reboot.py", "scripts/native_linux_snapshots.py", "scripts/native_linux_successor.py", "scripts/native_linux_restart.py", "scripts/native_linux_restore.py", "scripts/native_linux_restored_boot.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 20
