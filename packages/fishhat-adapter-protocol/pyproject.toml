[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fishhat-adapter-protocol"
version = "0.1.0.dev0"
description = "Implementation-neutral closed adapter contracts and semantic validation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-contracts==0.1.0.dev0", "jsonschema==4.26.0", "referencing==0.37.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishhat_adapters = ["py.typed"]

[tool.uv.sources]
fishhat-contracts = { workspace = true }

[tool.fishhat.component]
id = "adapter-protocol"
module = "fishhat_adapters"
role = "adapter-protocol"
