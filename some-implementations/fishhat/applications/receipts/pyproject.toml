[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fishhat-reporting"
version = "0.1.0.dev0"
description = "Fishhat optional-reporting reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-contracts==0.1.0.dev0", "alembic>=1.18,<2", "sqlalchemy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishhat_reporting = ["py.typed", "schema/*.sql"]

[tool.uv.sources]
fishhat-contracts = { workspace = true }

[tool.fishhat.component]
id = "reporting"
module = "fishhat_reporting"
role = "optional-reporting"
