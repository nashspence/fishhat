[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fishhat-cli-support"
version = "0.1.0.dev0"
description = "Fishhat shared-cli reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-contracts==0.1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishhat_cli = ["py.typed"]

[tool.uv.sources]
fishhat-contracts = { workspace = true }

[tool.fishhat.component]
id = "cli-support"
module = "fishhat_cli"
role = "shared-cli"
